# staticcheck 配置
#
# checks 需完整写出静态检查集合：staticcheck 发现本文件时不会再补上它自己的默认集合，
# 因此这里保留默认开启的全部检查，并排除默认关闭的 ST1000/ST1003/ST1016/ST102x。
#
# 额外关闭 ST1008(error 应是最后一个返回值): Fire/Trigger/FireCtx/FireEventCtx 等
# 按既有设计返回 (error, Event)，调整返回顺序属于破坏性 API 变更，暂不处理。
checks = [
  "all",
  "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023",
  "-ST1008",
]
